<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rise with Shashank — Meditation, Mindfulness & Life Coaching</title>
    <meta
      name="description"
      content="Mind-first wellness coaching with Shashank Lalwani in Pune, India — meditation, breathwork, 1:1 coaching, weekend retreats and corporate wellness programs."
    />
    <meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1210" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/images/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved / system theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("rws-theme");
          var theme =
            saved ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
